[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-platform-reliability-agent"
version = "0.1.0"
description = "A policy-controlled investigation agent for AWS, EKS, and Terraform."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2,<3",
]

[project.scripts]
platform-agent = "platform_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
