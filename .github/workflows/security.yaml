name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infrastructure:
    name: Checkov infrastructure scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            checkov==3.3.19

      - name: Scan infrastructure and workflow configuration
        run: |
          checkov \
            --directory . \
            --framework all \
            --quiet \
            --soft-fail

  filesystem:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan dependencies and repository files
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  container:
    name: Trivy container scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: application
          load: true
          push: false
          tags: aws-platform-app:security

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aws-platform-app:security
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Ignore pip's bundled third-party SBOM, not installed packages.
          skip-files: usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json
          format: table
          exit-code: "0"
